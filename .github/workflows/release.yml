name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS

    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            build-essential \
            curl \
            file \
            patchelf

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches app versions
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";

            const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
            const tauriVersion = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const cargoManifest = readFileSync("src-tauri/Cargo.toml", "utf8");
            const cargoVersion = cargoManifest.match(/^version = "([^"]+)"/m)?.[1];
            const tag = process.env.GITHUB_REF_NAME;
            const versions = [packageVersion, tauriVersion, cargoVersion];

            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
              throw new Error(`Invalid release tag: ${tag}`);
            }

            if (versions.some((version) => `v${version}` !== tag)) {
              throw new Error(`Release tag ${tag} must match package, Tauri, and Cargo versions: ${versions.join(", ")}`);
            }
          '

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Conlangia ${{ github.ref_name }}
          releaseBody: Download the installer for your platform from the assets below.
          releaseDraft: true
